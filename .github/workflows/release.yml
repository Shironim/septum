name: Release Standalone Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Test Suite
        run: bun test

      - name: Compile Standalone Binaries
        run: bun run scripts/compile.ts

      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum septum-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/septum-linux-x64
            dist/septum-linux-arm64
            dist/septum-darwin-x64
            dist/septum-darwin-arm64
            dist/septum-windows-x64.exe
            dist/checksums.txt
            install.sh
            install.ps1
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
